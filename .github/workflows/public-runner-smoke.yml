name: Public GitHub-hosted runner smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Confirm public hosted runner allocation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner started
        run: |
          set -euo pipefail
          echo "GitHub-hosted runner allocated successfully."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"

      - name: Record harmless environment proof
        run: |
          set -euo pipefail
          uname -a
          node --version
