name: After Dark - validated Surge preview and manual release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Preview never affects production. Release explicitly publishes to production."
        required: true
        default: preview
        type: choice
        options:
          - preview
          - release

permissions:
  contents: read

concurrency:
  group: after-dark-surge
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved non-explicit single-file content
        run: node docs/after-dark/validate-preview.mjs
      - name: Run regression tests without credentials
        run: node --test docs/after-dark/tests/*.test.mjs
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: after-dark-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Surge account authorization
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo '::error::Surge account authorization is missing. Store a domain-scoped SURGE_TOKEN in GitHub Actions secrets, using a secure account sign-in.'
            exit 1
          fi
      - name: Publish and verify without leaking secrets
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: bash docs/after-dark/deploy-ci.sh
