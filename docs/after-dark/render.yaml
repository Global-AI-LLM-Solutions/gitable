# Pre-launch NON-EXPLICIT concept preview only.
# Render must approve any later adult-industry commercial affiliate activity.
# This blueprint does not enable age-restricted content, links, paid usage or verification.
services:
  - type: web
    runtime: static
    name: after-dark-concept
    repo: https://github.com/Global-AI-LLM-Solutions/gitable
    branch: main
    buildCommand: echo "After Dark static demo"
    staticPublishPath: ./docs/after-dark
    autoDeployTrigger: "off"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
